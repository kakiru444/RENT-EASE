<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RentEase — Tables & Chairs Rental</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.25s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .status-badge { font-size:.75rem; font-weight:600; padding:.25rem .625rem; border-radius:9999px; display:inline-block; }
    header { padding-top: env(safe-area-inset-top, 0px); }
    footer { padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .card-hover { transition: transform 0.15s, box-shadow 0.15s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .modal-backdrop { background: rgba(15, 23, 42, 0.55); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">R</div>
          <div>
            <h1 class="font-bold text-lg leading-tight text-slate-900">RentEase</h1>
            <p class="text-xs text-slate-500">Tables & Chairs Rental</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="switchMode('client')" id="btn-client" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Client</button>
          <button onclick="switchMode('admin')" id="btn-admin" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Admin</button>
        </div>
      </div>
    </header>

    <!-- Navigation -->
    <nav id="nav" class="bg-white border-b border-slate-200 overflow-x-auto">
      <div class="max-w-7xl mx-auto px-4 flex gap-1 py-2 text-sm font-medium" id="nav-links"></div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6" id="main-content"></main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
      RentEase Prototype • Data saved in your browser (localStorage) • Single-file demo
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden"></div>

  <!-- Generic Modal -->
  <div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto" id="modal-content"></div>
  </div>

  <script>
    // ===================== DATA & STATE =====================
    const DEFAULT_ITEMS = [];
    const DEFAULT_RESERVATIONS = [];

    let state = {
      mode: 'client',
      view: 'home',
      items: [],
      reservations: [],
      cart: [],
      gcashQR: null,          // base64 image of admin GCash QR
      feesByCategory: {},      // categories created only in Settings
      downPaymentPercent: 50, // % of total required as down payment via GCash
      depositPercent: 50,     // refundable security deposit, % of rental subtotal
      deliveryFee: 200,       // flat delivery fee in pesos
      adminPin: '',           // optional PIN to open Admin
      adminUnlocked: false,
      messages: [],           // messaging between client & admin
      currentUser: { name: "Guest Customer", role: "customer" }
    };

    // ===================== HELPERS =====================
    function loadData() {
      try { loadDataRaw(); } catch (err) { console.warn("Could not read saved data", err); }
    }
    function loadDataRaw() {
      // Start completely empty — user will input all data
      // Clear any previous demo data from localStorage
      const hasCleanFlag = localStorage.getItem('rentease_clean_v3');
      if (!hasCleanFlag) {
        localStorage.removeItem('rentease_items');
        localStorage.removeItem('rentease_reservations');
        localStorage.removeItem('rentease_cart');
        localStorage.removeItem('rentease_gcash_qr');
        localStorage.removeItem('rentease_fees');
        localStorage.removeItem('rentease_messages');
        localStorage.removeItem('rentease_clean_v2');
        localStorage.setItem('rentease_clean_v3', '1');
      }

      const savedItems = localStorage.getItem('rentease_items');
      const savedRes = localStorage.getItem('rentease_reservations');
      const savedCart = localStorage.getItem('rentease_cart');
      const savedQR = localStorage.getItem('rentease_gcash_qr');
      const savedFees = localStorage.getItem('rentease_fees');
      const savedMsgs = localStorage.getItem('rentease_messages');
      state.items = savedItems ? JSON.parse(savedItems) : [];
      state.reservations = savedRes ? JSON.parse(savedRes) : [];
      state.cart = savedCart ? JSON.parse(savedCart) : [];
      state.gcashQR = savedQR || null;
      state.messages = savedMsgs ? JSON.parse(savedMsgs) : [];
      if (savedFees) {
        const fees = JSON.parse(savedFees);
        state.downPaymentPercent = fees.downPaymentPercent ?? 50;
        state.depositPercent = fees.depositPercent ?? 50;
        state.deliveryFee = fees.deliveryFee ?? 200;
        state.adminPin = fees.adminPin || '';
        if (fees.feesByCategory && typeof fees.feesByCategory === 'object') {
          state.feesByCategory = fees.feesByCategory;
        } else {
          state.feesByCategory = {};
        }
      }
    }

    function saveData() {
      try { saveDataRaw(); } catch (err) { toast("Could not save. Storage is full or blocked. Try smaller photos.", "error"); }
      scheduleSync();
    }
    function saveDataRaw() {
      localStorage.setItem('rentease_items', JSON.stringify(state.items));
      localStorage.setItem('rentease_reservations', JSON.stringify(state.reservations));
      localStorage.setItem('rentease_cart', JSON.stringify(state.cart));
      localStorage.setItem('rentease_messages', JSON.stringify(state.messages));
      localStorage.setItem('rentease_fees', JSON.stringify({
        feesByCategory: state.feesByCategory,
        downPaymentPercent: state.downPaymentPercent,
        depositPercent: state.depositPercent,
        deliveryFee: state.deliveryFee,
        adminPin: state.adminPin
      }));
      if (state.gcashQR) {
        localStorage.setItem('rentease_gcash_qr', state.gcashQR);
      } else {
        localStorage.removeItem('rentease_gcash_qr');
      }
    }

    function getCategoryFees(category) {
      const cat = category || 'Other';
      return state.feesByCategory[cat] || { damage: 200, missing: 500 };
    }

    function ensureCategory(cat) {
      const name = (cat || '').trim();
      if (!name) return 'Other';
      if (!state.feesByCategory[name]) {
        state.feesByCategory[name] = { damage: 200, missing: 500 };
      }
      return name;
    }

    function getAllCategories() {
      // Categories come only from Settings (feesByCategory keys)
      return Object.keys(state.feesByCategory || {}).sort();
    }

    function money(n) { return '₱' + Number(n).toLocaleString('en-PH'); }

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-blue-600' };
      el.className = `fixed bottom-4 right-4 z-50 px-4 py-3 rounded-lg text-white text-sm font-medium shadow-lg ${colors[type] || colors.success}`;
      el.textContent = msg;
      el.style.bottom = 'calc(1rem + env(safe-area-inset-bottom, 0px))';
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function statusBadge(status) {
      const map = {
        'Pending': 'bg-amber-100 text-amber-800',
        'Confirmed': 'bg-blue-100 text-blue-800',
        'Preparing': 'bg-indigo-100 text-indigo-800',
        'Ongoing': 'bg-purple-100 text-purple-800',
        'Completed': 'bg-emerald-100 text-emerald-800',
        'Cancelled': 'bg-slate-100 text-slate-600',
        'Overdue': 'bg-red-100 text-red-800',
        'Paid': 'bg-emerald-100 text-emerald-800',
        'Partial': 'bg-amber-100 text-amber-800',
        'Unpaid': 'bg-red-100 text-red-800',
        'Payment Submitted': 'bg-sky-100 text-sky-800',
        'Refunded': 'bg-slate-100 text-slate-600'
      };
      return `<span class="status-badge ${map[status] || 'bg-slate-100 text-slate-600'}">${status}</span>`;
    }

    function generateId() {
      const num = 10000 + Math.floor(Math.random() * 90000);
      return `REN-2026-${num}`;
    }

    // Modal helpers
    function openModal(html) {
      document.getElementById('modal-content').innerHTML = html;
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // ===================== NAVIGATION =====================
    function removePin() {
      state.adminPin = '';
      saveData();
      toast('Admin PIN removed');
      render();
    }

    function checkPin(e) {
      e.preventDefault();
      if (e.target.pin.value === state.adminPin) {
        state.adminUnlocked = true;
        closeModal();
        switchMode('admin');
      } else {
        toast('Wrong PIN', 'error');
      }
    }

    function switchMode(mode) {
      if (mode === 'admin' && !isAdminCloud()) {
        openLoginModal();
        return;
      }
      state.mode = mode;
      state.view = mode === 'client' ? 'home' : 'dashboard';
      render();
    }

    function setView(view) {
      state.view = view;
      render();
    }

    function renderNav() {
      const unreadClient = state.messages.filter(m => m.to === 'client' && !m.read).length;
      const unreadAdmin = state.messages.filter(m => m.to === 'admin' && !m.read).length;
      const clientLinks = [
        { id: 'home', label: 'Home', icon: 'fa-home' },
        { id: 'catalog', label: 'Catalog', icon: 'fa-chair' },
        { id: 'cart', label: 'Cart', icon: 'fa-shopping-cart', badge: state.cart.length },
        { id: 'bookings', label: 'My Bookings', icon: 'fa-calendar-check' },
        { id: 'messages', label: 'Messages', icon: 'fa-comments', badge: unreadClient }
      ];
      const adminLinks = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
        { id: 'inventory', label: 'Inventory', icon: 'fa-boxes-stacked' },
        { id: 'reservations', label: 'Reservations', icon: 'fa-clipboard-list' },
        { id: 'returns', label: 'Returns', icon: 'fa-undo' },
        { id: 'messages', label: 'Messages', icon: 'fa-comments', badge: unreadAdmin },
        { id: 'reports', label: 'Reports', icon: 'fa-chart-bar' },
        { id: 'settings', label: 'Settings', icon: 'fa-cog' }
      ];
      const links = state.mode === 'client' ? clientLinks : adminLinks;
      document.getElementById('nav-links').innerHTML = links.map(l => `
        <button onclick="setView('${l.id}')" class="flex items-center gap-2 px-3 py-2 rounded-lg whitespace-nowrap transition ${state.view === l.id ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-100'}">
          <i class="fas ${l.icon}"></i> ${l.label}
          ${l.badge ? `<span class="bg-emerald-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">${l.badge}</span>` : ''}
        </button>
      `).join('');

      document.getElementById('btn-client').className = `px-3 py-1.5 rounded-lg text-sm font-medium transition ${state.mode === 'client' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
      document.getElementById('btn-admin').className = `px-3 py-1.5 rounded-lg text-sm font-medium transition ${state.mode === 'admin' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
    }

    // ===================== CLIENT VIEWS =====================
    function renderHome() {
      return `
        <div class="fade-in space-y-8">
          <section class="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-2xl p-8 text-white">
            <h2 class="text-3xl font-bold mb-2">Rent Tables & Chairs Easily</h2>
            <p class="text-emerald-100 mb-6 max-w-xl">Quality tables and chairs for birthdays, weddings, meetings, and events. Check availability, book online, and track your reservation.</p>
            <div class="flex flex-wrap gap-3">
              <button onclick="setView('catalog')" class="bg-white text-emerald-700 font-semibold px-5 py-2.5 rounded-lg hover:bg-emerald-50 transition">Browse Catalog</button>
              <button onclick="setView('bookings')" class="bg-emerald-500/30 text-white font-semibold px-5 py-2.5 rounded-lg border border-white/30 hover:bg-emerald-500/40 transition">My Bookings</button>
            </div>
          </section>

          <section>
            <h3 class="text-lg font-semibold mb-4">Popular Items</h3>
            ${state.items.length === 0 ? `
              <div class="bg-white rounded-xl border border-dashed border-slate-300 p-8 text-center text-slate-400">
                <p class="text-sm">No items available yet. Admin needs to add inventory first.</p>
              </div>
            ` : `
              <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                ${state.items.slice(0,6).map(item => `
                  <div class="bg-white rounded-xl border border-slate-200 p-4 text-center card-hover cursor-pointer" onclick="setView('catalog')">
                    <div class="mb-2 flex justify-center">${renderItemThumb(item, 'w-16 h-16')}</div>
                    <div class="font-medium text-sm">${item.name}</div>
                    <div class="text-emerald-600 font-semibold text-sm mt-1">${money(item.price)}/day</div>
                  </div>
                `).join('')}
              </div>
            `}
          </section>

          <section class="grid md:grid-cols-3 gap-4">
            <div class="bg-white rounded-xl border border-slate-200 p-5">
              <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center mb-3"><i class="fas fa-calendar-check"></i></div>
              <h4 class="font-semibold mb-1">Easy Booking</h4>
              <p class="text-sm text-slate-500">Select items, pick dates, and reserve in minutes.</p>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 p-5">
              <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-3"><i class="fas fa-qrcode"></i></div>
              <h4 class="font-semibold mb-1">Pay via GCash</h4>
              <p class="text-sm text-slate-500">Scan the QR code and upload your receipt easily.</p>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 p-5">
              <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center mb-3"><i class="fas fa-shield-alt"></i></div>
              <h4 class="font-semibold mb-1">Secure Deposit</h4>
              <p class="text-sm text-slate-500">Refundable deposit protects both parties.</p>
            </div>
          </section>
        </div>
      `;
    }

    function renderCatalog() {
      return `
        <div class="fade-in">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold">Catalog</h2>
            <span class="text-sm text-slate-500">${state.items.length} items</span>
          </div>
          ${state.items.length === 0 ? `
            <div class="bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center text-slate-400">
              <i class="fas fa-box-open text-4xl mb-3"></i>
              <p class="font-medium">Catalog is empty</p>
              <p class="text-sm">Switch to Admin → Inventory to add tables and chairs.</p>
            </div>
          ` : `
          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            ${state.items.map(item => `
              <div class="bg-white rounded-xl border border-slate-200 overflow-hidden card-hover">
                <div class="bg-slate-50 h-40 flex items-center justify-center overflow-hidden">
                  ${renderItemHero(item)}
                </div>
                <div class="p-4">
                  <div class="flex justify-between items-start mb-1">
                    <h3 class="font-semibold">${item.name}</h3>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${item.category}</span>
                  </div>
                  <p class="text-sm text-slate-500 mb-3">${item.desc || ''}</p>
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-emerald-600 font-bold">${money(item.price)}<span class="text-slate-400 font-normal text-sm">/day</span></span>
                    <span class="text-xs text-slate-500">${item.available} available</span>
                  </div>
                  <div class="flex gap-2">
                    <input type="number" id="qty-${item.id}" min="1" max="${item.available}" value="1" class="w-20 border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
                    <button onclick="addToCart(${item.id})" class="flex-1 bg-emerald-600 text-white text-sm font-medium py-1.5 rounded-lg hover:bg-emerald-700 transition">Add to Cart</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          `}
        </div>
      `;
    }

    function addToCart(itemId) {
      const item = state.items.find(i => i.id === itemId);
      if (!item) return;
      const qtyInput = document.getElementById(`qty-${itemId}`);
      let qty = parseInt(qtyInput?.value || 1);
      if (isNaN(qty) || qty < 1) {
        toast('Invalid quantity', 'error');
        return;
      }
      const existing = state.cart.find(c => c.id === itemId);
      const alreadyInCart = existing ? existing.qty : 0;
      const canAdd = item.available - alreadyInCart;
      if (canAdd <= 0) {
        toast(`All available ${item.name} are already in your cart`, 'error');
        return;
      }
      if (qty > canAdd) {
        qty = canAdd;
        toast(`Only ${canAdd} more available — added ${canAdd}`, 'info');
      }
      if (existing) {
        existing.qty += qty;
      } else {
        state.cart.push({ id: item.id, name: item.name, price: item.price, qty, image: item.image });
      }
      saveData();
      toast(`${item.name} added to cart`);
      render();
    }

    function updateCartQty(itemId, delta) {
      const cartItem = state.cart.find(c => c.id === itemId);
      if (!cartItem) return;
      const invItem = state.items.find(i => i.id === itemId);
      const maxAvailable = invItem ? invItem.available : cartItem.qty;

      if (delta > 0 && cartItem.qty >= maxAvailable) {
        toast(`Only ${maxAvailable} available`, 'error');
        return;
      }

      cartItem.qty += delta;
      if (cartItem.qty <= 0) {
        state.cart = state.cart.filter(c => c.id !== itemId);
      } else if (cartItem.qty > maxAvailable) {
        cartItem.qty = maxAvailable;
      }
      saveData();
      render();
    }

    function setCartQty(itemId, value) {
      const cartItem = state.cart.find(c => c.id === itemId);
      if (!cartItem) return;
      const invItem = state.items.find(i => i.id === itemId);
      const maxAvailable = invItem ? invItem.available : cartItem.qty;

      let qty = parseInt(value, 10);
      if (isNaN(qty) || qty < 1) {
        // keep current if invalid while typing; remove only on blur via setCartQtyBlur
        return;
      }
      if (qty > maxAvailable) {
        qty = maxAvailable;
        toast(`Only ${maxAvailable} available`, 'error');
      }
      cartItem.qty = qty;
      saveData();
      render();
    }

    function setCartQtyBlur(itemId, value) {
      const cartItem = state.cart.find(c => c.id === itemId);
      if (!cartItem) return;
      let qty = parseInt(value, 10);
      if (isNaN(qty) || qty < 1) {
        state.cart = state.cart.filter(c => c.id !== itemId);
        saveData();
        render();
        return;
      }
      setCartQty(itemId, qty);
    }

    function removeFromCart(itemId) {
      state.cart = state.cart.filter(c => c.id !== itemId);
      saveData();
      render();
    }

    function renderCart() {
      const subtotal = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
      const deposit = Math.round(subtotal * state.depositPercent / 100);
      const deliveryFee = subtotal > 0 ? state.deliveryFee : 0;
      const total = subtotal + deposit + deliveryFee;

      if (state.cart.length === 0) {
        return `
          <div class="fade-in text-center py-16">
            <div class="text-5xl mb-4">🛒</div>
            <h2 class="text-xl font-semibold mb-2">Your cart is empty</h2>
            <p class="text-slate-500 mb-6">Browse the catalog and add items to get started.</p>
            <button onclick="setView('catalog')" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-emerald-700">Go to Catalog</button>
          </div>
        `;
      }

      return `
        <div class="fade-in grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-4">
            <h2 class="text-xl font-bold">Rental Cart</h2>
            ${state.cart.map(c => {
              const inv = state.items.find(i => i.id === c.id);
              const maxAvail = inv ? inv.available : c.qty;
              const atMax = c.qty >= maxAvail;
              return `
              <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center gap-4">
                ${renderItemThumb(c, 'w-14 h-14')}
                <div class="flex-1">
                  <div class="font-medium">${c.name}</div>
                  <div class="text-sm text-slate-500">${money(c.price)} × ${c.qty} <span class="text-slate-400">(max ${maxAvail})</span></div>
                </div>
                <div class="flex items-center gap-1">
                  <button type="button" onclick="updateCartQty(${c.id}, -1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200">−</button>
                  <input type="number" min="1" max="${maxAvail}" value="${c.qty}"
                    class="w-14 border border-slate-300 rounded-lg text-center text-sm py-1.5 font-medium"
                    onchange="setCartQty(${c.id}, this.value)"
                    onblur="setCartQtyBlur(${c.id}, this.value)"
                    onclick="this.select()">
                  <button type="button" onclick="updateCartQty(${c.id}, 1)" class="w-8 h-8 rounded-lg ${atMax ? 'bg-slate-50 text-slate-300 cursor-not-allowed' : 'bg-slate-100 hover:bg-slate-200'}" ${atMax ? 'disabled' : ''}>+</button>
                </div>
                <div class="font-semibold w-20 text-right">${money(c.price * c.qty)}</div>
                <button onclick="removeFromCart(${c.id})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash-alt"></i></button>
              </div>
            `}).join('')}
          </div>

          <div>

    function submitBooking(e) {
      e.preventDefault();
      const form = e.target;
      const subtotal = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
      const deposit = Math.round(subtotal * state.depositPercent / 100);
      const deliveryFee = state.deliveryFee;
      const total = subtotal + deposit + deliveryFee;

      const reservation = {
        id: generateId(),
        customer: clean(form.customer.value),
        contact: clean(form.contact.value),
        event: clean(form.event.value) || 'Event',
        location: clean(form.location.value),
        rentalDate: form.rentalDate.value,
        returnDate: form.returnDate.value,
        items: state.cart.map(c => ({ id: c.id, qty: c.qty, price: c.price })),
        subtotal, deliveryFee, deposit, total,
        paid: 0,
        status: 'Pending',
        paymentStatus: 'Unpaid',
        paymentMethod: '',
        created: new Date().toISOString().slice(0,10),
        notes: clean(form.notes.value),
        proofOfPayment: null
      };

      for (const c of state.cart) {
        const item = state.items.find(i => i.id === c.id);
        if (c.qty > item.available) {
          toast(`Not enough ${item.name} available`, 'error');
          return;
        }
      }

      state.cart.forEach(c => {
        const item = state.items.find(i => i.id === c.id);
        item.available -= c.qty;
        item.rented += c.qty;
      });

      state.reservations.unshift(reservation);
      state.cart = [];
      saveData();
      toast('Reservation submitted! ID: ' + reservation.id);
      setView('bookings');
    }

    let tempProofBase64 = null;

    function previewProof(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        toast('Image too large (max 3MB)', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(ev) {
        tempProofBase64 = ev.target.result;
        document.getElementById('proof-preview').innerHTML = `<img src="${tempProofBase64}" class="max-h-48 mx-auto rounded-lg">`;
        document.getElementById('btn-submit-proof').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function submitProof(reservationId) {
      if (!tempProofBase64) {
        toast('Please select an image first', 'error');
        return;
      }
      const r = state.reservations.find(x => x.id === reservationId);
      if (!r) return;

      r.proofOfPayment = tempProofBase64;
      r.paymentStatus = 'Payment Submitted';
      r.paymentMethod = 'GCash';
      r.paymentSubmittedAt = new Date().toISOString();
      r.expectedDpAmount = getDownPaymentAmount(r); // store expected DP for admin
      tempProofBase64 = null;
      saveData();
      closeModal();
      toast('Down payment proof uploaded! Waiting for admin confirmation.');
      render();
    }

      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        toast('Image too large (max 3MB)', 'error');
        e.target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = function(ev) {
        tempNewItemPhoto = ev.target.result;

          preview.innerHTML = `<img src="${tempNewItemPhoto}" class="w-full h-full object-cover">`;

    function renderItemThumb(item, sizeClass = 'w-12 h-12') {
      if (item.image && item.image.startsWith('data:image')) {
        return `<img src="${item.image}" alt="${item.name}" class="${sizeClass} rounded-lg object-cover border border-slate-200">`;
      }
      // fallback for old emoji or missing photo
      return `<div class="${sizeClass} rounded-lg bg-slate-100 flex items-center justify-center text-xl border border-slate-200">${item.image || '📦'}</div>`;
    }

    function renderItemHero(item) {
      if (item.image && item.image.startsWith('data:image')) {
        return `<img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">`;
      }
      return `<div class="text-5xl">${item.image || '📦'}</div>`;
    }

    function addNewItem(e) {
      e.preventDefault();
      const form = e.target;
      const name = clean(form.name.value);
      const category = cleanKey(form.category?.value);
      if (!category) {
        toast('Please select a category. Add categories in Settings first.', 'error');
        return;
      }
      ensureCategory(category);
      const price = parseFloat(form.price.value);
      const qty = parseInt(form.qty.value);
      const desc = clean(form.desc.value);
      const image = tempNewItemPhoto || '📦';

      if (!name || isNaN(price) || price < 0 || isNaN(qty) || qty < 1) {
        toast('Please fill in valid name, price, and quantity', 'error');
        return;
      }

      const newId = state.items.length > 0 ? Math.max(...state.items.map(i => i.id)) + 1 : 1;
      state.items.push({
        id: newId,
        name,
        category,
        price,
        total: qty,
        available: qty,
        rented: 0,
        damaged: 0,
        image,
        desc
      });
      saveData();
      toast(`${name} added (${category})`);
      tempNewItemPhoto = null;
      form.reset();
      const preview = document.getElementById('new-item-photo-preview');
      if (preview) preview.innerHTML = 'No photo';
      render();
    }

    function adjustStock(id, direction) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      const input = document.getElementById(`stock-input-${id}`);
      let amount = parseInt(input?.value || 1);
      if (isNaN(amount) || amount < 1) amount = 1;

      const delta = direction * amount;

      // Cannot reduce available below 0, and cannot reduce total below currently rented
      if (delta < 0) {
        const maxReduce = item.available;
        if (Math.abs(delta) > maxReduce) {
          toast(`Can only remove up to ${maxReduce} (available stock)`, 'error');
          return;
        }
      }

      item.total = Math.max(item.rented, item.total + delta);
      item.available = Math.max(0, item.available + delta);
      saveData();
      toast(`${item.name}: ${delta > 0 ? '+' : ''}${delta} → Total ${item.total}, Available ${item.available}`);
      render();
    }

    function recordPayment(id) {
      const r = state.reservations.find(x => x.id === id);
      if (!r) return;
      const remaining = r.total - r.paid;
      const amount = prompt(`Record payment for ${id}\nRemaining: ${money(remaining)}\nEnter amount:`, remaining);
      if (amount === null) return;
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) {
        toast('Invalid amount', 'error');
        return;
      }
      r.paid = Math.min(r.total, r.paid + val);
      r.paymentStatus = r.paid >= r.total ? 'Paid' : 'Partial';
      if (!r.paymentMethod) r.paymentMethod = 'Cash';
      saveData();
      toast(`Payment recorded: ${money(val)}`);
      render();
    }

    function confirmGCashPayment(id) {
      const r = state.reservations.find(x => x.id === id);
      if (!r) return;
      const dpAmount = r.expectedDpAmount || getDownPaymentAmount(r);
      if (!confirm(`Confirm that you received the down payment of ${money(dpAmount)} via GCash for ${id}?\n\nThis will mark payment as Partial (DP paid). Remaining balance: ${money(r.total - dpAmount)}`)) return;
      
      r.paid = Math.min(r.total, (r.paid || 0) + dpAmount);
      r.paymentStatus = r.paid >= r.total ? 'Paid' : 'Partial';
      r.paymentMethod = 'GCash';
      r.proofOfPayment = r.proofOfPayment; // keep proof

    function validateReturnRow(input) {
      const row = input.closest('tr');
      const released = parseInt(row.dataset.released) || 0;
      const goodEl = row.querySelector('.return-good');
      const damagedEl = row.querySelector('.return-damaged');
      const missingEl = row.querySelector('.return-missing');

      let good = parseInt(goodEl.value) || 0;
      let damaged = parseInt(damagedEl.value) || 0;
      let missing = parseInt(missingEl.value) || 0;

      // Clamp individual values
      if (good < 0) good = 0;
      if (damaged < 0) damaged = 0;
      if (missing < 0) missing = 0;
      if (damaged > released) damaged = released;
      if (missing > released) missing = released;

      // When damaged or missing changes, auto-adjust Good so totals match
      if (input.classList.contains('return-damaged') || input.classList.contains('return-missing')) {
        good = Math.max(0, released - damaged - missing);
        goodEl.value = good;
        damagedEl.value = damaged;
        missingEl.value = missing;
      } else {
        // When Good changes, clamp so total doesn't exceed released
        const total = good + damaged + missing;
        if (total > released) {
          good = Math.max(0, released - damaged - missing);
          goodEl.value = good;
        }
      }

      updateExtraChargesPreview();
    }

    function updateExtraChargesPreview() {
      let extra = 0;
      document.querySelectorAll('#return-form-body tr').forEach(row => {
        const itemId = parseInt(row.dataset.itemId);
        const item = state.items.find(i => i.id === itemId);
        const fees = getCategoryFees(item?.category);
        const damaged = parseInt(row.querySelector('.return-damaged').value) || 0;
        const missing = parseInt(row.querySelector('.return-missing').value) || 0;
        extra += damaged * fees.damage + missing * fees.missing;
      });
      const el = document.getElementById('extra-charges-preview');
      if (el) {
        el.textContent = money(extra);
        el.className = extra > 0 ? 'font-semibold text-red-600' : 'font-semibold text-emerald-600';
      }
    }

    function submitReturnForm(id) {
      const r = state.reservations.find(x => x.id === id);
      if (!r) return;

      const returned = [];
      let valid = true;

      document.querySelectorAll('#return-form-body tr').forEach(row => {
        const itemId = parseInt(row.dataset.itemId);
        const released = parseInt(row.dataset.released);
        const good = parseInt(row.querySelector('.return-good').value) || 0;
        const damaged = parseInt(row.querySelector('.return-damaged').value) || 0;
        const missing = parseInt(row.querySelector('.return-missing').value) || 0;

        if (good + damaged + missing !== released) {
          valid = false;
        }
        returned.push({ id: itemId, qty: good, damaged, missing });
      });

      if (!valid) {
        toast('Good + Damaged + Missing must equal Released quantity for every item', 'error');
        return;
      }

      const extra = returned.reduce((s, x) => {
        const item = state.items.find(i => i.id === x.id);
        const fees = getCategoryFees(item?.category);
        return s + x.damaged * fees.damage + x.missing * fees.missing;
      }, 0);
      const notes = document.getElementById('return-notes')?.value || '';

      r.returnData = { returned, extraCharges: extra, notes };
      r.status = 'Completed';

      // Update inventory
      returned.forEach(ret => {
        const item = state.items.find(i => i.id === ret.id);
        if (item) {
          item.available += ret.qty;                    // good items go back to available
          item.rented = Math.max(0, item.rented - (ret.qty + ret.damaged + ret.missing));
          item.damaged += ret.damaged;                  // track damaged
          // missing items are simply lost (total stock effectively reduced)
          item.total = Math.max(0, item.total - ret.missing);
        }
      });

      saveData();
      closeModal();
      toast(extra > 0 ? `Return saved. Extra charges: ${money(extra)}` : 'Return saved. All items in good condition.');
      render();
    }

      const dpEl = document.getElementById('fee-dp-percent');
      if (dpEl) {

        if (isNaN(dp) || dp < 1 || dp > 100) {
          toast('Down payment must be between 1 and 100%', 'error');
          return;
        }
        state.downPaymentPercent = dp;
      }

      const depEl = document.getElementById('fee-deposit-pct');
      const delEl = document.getElementById('fee-delivery');
      const pinEl = document.getElementById('admin-pin');
      if (depEl && delEl) {
        const dep = parseFloat(depEl.value), del = parseFloat(delEl.value);
        if (isNaN(dep) || dep < 0 || dep > 100 || isNaN(del) || del < 0) {
          toast('Deposit must be 0 to 100% and delivery fee 0 or more', 'error');
          return;
        }
        state.depositPercent = dep;
        state.deliveryFee = del;
      }
      if (pinEl && pinEl.value) {
        if (!/^\d{4,}$/.test(pinEl.value)) { toast('PIN must be 4 or more digits', 'error'); return; }
        state.adminPin = pinEl.value;
        state.adminUnlocked = true;
      }

      // Per-category fees from dynamic inputs
      document.querySelectorAll('.fee-cat-input').forEach(inp => {
        const cat = inp.dataset.cat;
        const type = inp.dataset.type;
        const val = parseFloat(inp.value);
        if (!cat || isNaN(val) || val < 0) return;
        if (!state.feesByCategory[cat]) state.feesByCategory[cat] = { damage: 200, missing: 500 };
        if (type === 'damage') state.feesByCategory[cat].damage = val;
        if (type === 'missing') state.feesByCategory[cat].missing = val;
      });

      saveData();
      toast('Settings saved');
      render();
    }

        saveData();
        toast('GCash QR code uploaded successfully!');
        render();
      };
      reader.readAsDataURL(file);

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Text typed by people is stored escaped so it can never run as code
    function clean(v) {
      return String(v == null ? '' : v).trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    // Category names are also used inside onclick handlers, so quotes and slashes are removed
    function cleanKey(v) {
      return String(v == null ? '' : v).replace(/[<>&"'`\\]/g,'').trim();
    }

    function formatMsgTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch { return ''; }
    }

    const isAdminCloud = () => !!(session && session.access_token);
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); };
    const shopData = () => ({ feesByCategory: state.feesByCategory, downPaymentPercent: state.downPaymentPercent, depositPercent: state.depositPercent, deliveryFee: state.deliveryFee, gcashQR: state.gcashQR });
    const stateHash = () => hash(JSON.stringify([state.items, state.reservations, state.messages, shopData()]));

    function setSession(d) {
      session = d ? { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)) } : null;
      try { if (session) localStorage.setItem('rentease_session', JSON.stringify(session)); else localStorage.removeItem('rentease_session'); } catch (e) {}
    }
    async function authCall(grant, body) {
      const r = await fetch(CLOUD.url + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: CLOUD.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('auth ' + r.status);
      return r.json();
    }
    async function ensureFresh() {
      if (!session || session.expires_at * 1000 - Date.now() > 60000) return;
      try { setSession(await authCall('refresh_token', { refresh_token: session.refresh_token })); }
      catch (e) { if (/auth 4/.test(e.message)) setSession(null); }
    }
    async function api(path, opts = {}) {
      await ensureFresh();
      const headers = { apikey: CLOUD.key, 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (session) headers.Authorization = 'Bearer ' + session.access_token;
      const r = await fetch(CLOUD.url + path, { ...opts, headers });
      if (!r.ok) throw new Error(path + ' ' + r.status);
      const t = await r.text();
      return t ? JSON.parse(t) : null;
    }

    async function cloudPull() {
      const admin = isAdminCloud();
      const reqs = [api('/rest/v1/items?select=id,data'), api('/rest/v1/settings?select=value&key=eq.shop')];
      if (admin) reqs.push(api('/rest/v1/reservations?select=id,data&order=updated_at.desc'), api('/rest/v1/messages?select=id,data&order=updated_at.asc'));
      const [items, shop, res, msgs] = await Promise.all(reqs);

      if (!(admin && !items.length && state.items.length)) state.items = items.map(r => r.data);
      items.forEach(r => { sentHash['items:' + r.id] = JSON.stringify(r.data); });
      sentHash.itemIds = items.map(r => String(r.id));

      if (shop.length) {
        const v = shop[0].value || {};
        sentHash.shop = JSON.stringify(v);
        state.feesByCategory = v.feesByCategory || {};
        state.downPaymentPercent = v.downPaymentPercent ?? 50;
        state.depositPercent = v.depositPercent ?? 50;
        state.deliveryFee = v.deliveryFee ?? 200;
        state.gcashQR = v.gcashQR ?? null;
      }

      if (admin) {
        const base = new Map(), revs = [];
        res.forEach(r => {
          if (String(r.id).includes('~')) revs.push(r);
          else { base.set(String(r.id), r.data); sentHash['reservations:' + r.id] = JSON.stringify(r.data); }
        });
        // Customers send payment proof as a separate row; only these two fields are accepted
        const applied = [];
        revs.sort((a, b) => a.id.localeCompare(b.id)).forEach(r => {
          const b = base.get(r.id.split('~')[0]);
          if (!b) return;
          ['proofOfPayment', 'paymentMethod'].forEach(k => { if (r.data[k] != null) b[k] = r.data[k]; });
          applied.push(r.id);
        });
        const localOnly = state.reservations.filter(r => !base.has(String(r.id)));
        state.reservations = [...localOnly, ...base.values()];
        if (applied.length) {
          await api('/rest/v1/reservations?id=in.(' + encodeURIComponent(applied.map(i => '"' + i + '"').join(',')) + ')', { method: 'DELETE' });
        }
        const have = new Map(msgs.map(r => [String(r.id), r.data]));
        msgs.forEach(r => { sentHash['messages:' + r.id] = JSON.stringify(r.data); });
        state.messages = [...have.values(), ...state.messages.filter(m => !have.has(String(m.id)))].sort((a, b) => String(a.time).localeCompare(String(b.time)));
      }
    }

    function scheduleSync() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => { syncTimer = null; cloudPush(); }, 1200);
    }

    async function cloudPush() {
      if (syncing) { scheduleSync(); return; }
      syncing = true;
      try {
        const admin = isAdminCloud();
        const prefer = { Prefer: (admin ? 'resolution=merge-duplicates' : 'resolution=ignore-duplicates') + ',return=minimal' };
        const post = (t, rows) => api('/rest/v1/' + t + '?on_conflict=' + (t === 'settings' ? 'key' : 'id'), { method: 'POST', headers: prefer, body: JSON.stringify(rows) });

        if (admin && sentHash.itemIds) {
          const gone = sentHash.itemIds.filter(id => !state.items.some(i => String(i.id) === id));
          if (gone.length) await api('/rest/v1/items?id=in.(' + encodeURIComponent(gone.map(g => '"' + g + '"').join(',')) + ')', { method: 'DELETE' });
        }

        const jobs = admin
          ? { items: state.items, reservations: state.reservations, messages: state.messages }
          : { reservations: state.reservations, messages: state.messages.filter(m => m.from === 'client') };
        for (const t in jobs) {
          for (const o of jobs[t]) {
            const id = String(o.id), j = JSON.stringify(o), k = t + ':' + id;
            if (admin) {
              if (sentHash[k] === j) continue;
              await post(t, [{ id, data: o }]);
              sentHash[k] = j;
            } else {
              const h = t === 'reservations' ? hash(JSON.stringify([o.proofOfPayment, o.paymentMethod])) : '1';
              if (sentIds[k] === h) continue;
              const row = !sentIds[k] ? { id, data: o } : { id: id + '~' + Date.now(), data: { proofOfPayment: o.proofOfPayment, paymentMethod: o.paymentMethod } };
              await post(t, [row]);
              sentIds[k] = h;
              try { localStorage.setItem('rentease_sent_ids', JSON.stringify(sentIds)); } catch (e) {}
            }
          }
        }
        if (admin) {
          sentHash.itemIds = state.items.map(i => String(i.id));
          const sj = JSON.stringify(shopData());
          if (sentHash.shop !== sj) { await post('settings', [{ key: 'shop', value: shopData() }]); sentHash.shop = sj; }
        }
      } catch (e) {
        console.warn('sync failed', e);
        if (isAdminCloud()) toast('Sync failed. Will retry shortly.', 'error');
      } finally { syncing = false; }
    }

    async function cloudTick() {
      if (syncTimer || syncing) return;
      const a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      try {
        await cloudPush();
        const before = stateHash();
        await cloudPull();
        if (before !== stateHash()) { saveDataRawSafe(); render(); }
      } catch (e) { console.warn('pull failed', e); }
    }
    function saveDataRawSafe() { try { saveDataRaw(); } catch (e) {} }

    function openLoginModal() {
      openModal(`
        <form onsubmit="doLogin(event)" class="p-6">
          <h3 class="font-bold text-lg mb-3">Admin sign in</h3>
          <label class="text-xs font-medium text-slate-500" for="adm-email">Email</label>
          <input id="adm-email" name="email" type="email" autocomplete="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3">
          <label class="text-xs font-medium text-slate-500" for="adm-pass">Password</label>
          <input id="adm-pass" name="password" type="password" autocomplete="current-password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3">
          <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700">Sign in</button>
        </form>`);
    }
    async function doLogin(e) {
      e.preventDefault();
      const f = e.target;
      try {
        setSession(await authCall('password', { email: f.email.value.trim(), password: f.password.value }));
        closeModal();
        try { await cloudPull(); } catch (err) { console.warn(err); }
        saveDataRawSafe();
        switchMode('admin');
        scheduleSync();
      } catch (err) {
        toast('Wrong email or password', 'error');
      }
    }
    function cloudLogout() {
      setSession(null);
      switchMode('client');
      toast('Signed out');
    }

    // Init
    loadData();
    render();
    cloudTick();
    setInterval(cloudTick, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudTick(); });
  </script>
</body>
</html>
